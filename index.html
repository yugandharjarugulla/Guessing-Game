<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Number Guessing Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            padding: 20px;
        }

        .game-container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cfd8e3;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .range {
            display: inline-block;
            background: rgba(255, 255, 255, 0.12);
            padding: 10px 20px;
            border-radius: 30px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #dbeafe;
        }

        .input-box {
            width: 100%;
            padding: 16px;
            border: 2px solid transparent;
            border-radius: 12px;
            outline: none;
            font-size: 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            color: #222;
            transition: 0.3s;
        }

        .input-box:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.4);
        }

        .guess-btn {
            width: 100%;
            margin-top: 15px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            color: white;
            transition: 0.3s;
        }

        .guess-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.4);
        }

        .guess-btn:active {
            transform: scale(0.98);
        }

        #result {
            margin-top: 25px;
            min-height: 30px;
            font-size: 20px;
            font-weight: bold;
        }

        #number {
            margin-top: 15px;
            color: #a5f3fc;
            font-size: 14px;
        }

        .attempts {
            margin-top: 25px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 28px;
            }

            .icon {
                font-size: 50px;
            }
        }
    </style>
</head>

<body>

    <div class="game-container">

        <div class="icon">🎯</div>

        <h1>Number Guessing Game</h1>

        <p class="subtitle">
            Can you guess the secret number?
        </p>

        <div class="range">
            🔢 Choose a number between <strong>1 - 100</strong>
        </div>

        <input
            type="number"
            id="guess"
            class="input-box"
            placeholder="Enter your guess"
            min="1"
            max="100"
        >

        <button class="guess-btn" onclick="checkGuess()">
            🎯 Make a Guess
        </button>

        <div id="result"></div>

        <div id="number"></div>

        <div class="attempts">
            💡 Keep trying until you find the number!
        </div>

        <div class="footer">
            Built with HTML, CSS & JavaScript
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
